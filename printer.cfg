#[include shell_command.cfg]
[include mainsail.cfg]

# This file contains common pin mappings for the BigTreeTech OctoPus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths							[mcu] section
## Thermistor types						[extruder] and [heater_bed] sections - See 'sensor types' list at end of file
## Z Endstop Switch location			[safe_z_home] section
## Homing end position				[gcode_macro G32] section
## Z Endstop Switch  offset for Z0		[stepper_z] section
## Probe points							[quad_gantry_level] section
## Min & Max gantry corner postions		[quad_gantry_level] section
## PID tune								[extruder] and [heater_bed] sections
## Probe pin								[probe] section
## Fine tune E steps					[extruder] section

#[mcu]
##	[X in MOTOR0] - B Motor
##	[Y in MOTOR1] - A Motor
##	[E in MOTOR6] - Extruder
##	Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_470039000550534E4E313120-if00
#canbus_uuid: 0ad1ade02795
#restart_method: command
##--------------------------------------------------------------------



[mcu rpi]
serial: /tmp/klipper_host_mcu

[resonance_tester]
accel_chip:adxl345
probe_points:
    100,100,20 # an example

[exclude_object]

[skew_correction]


[save_variables]
#set this filename and path to somewhere convenient. Assumes your config lives in ~/klipper_config, it might be in ~/ or elsewhere
filename: /home/pi/klipper_config/printer_variables.cfg

#  Settings
#  lots of printer specific settings.
[include Settings/printer_limits.cfg]
#[include Settings/mcu_octopus.cfg]
[include Settings/toolhead_shtpro.cfg]
#[include Settings/toolhead_ebb11.cfg]
[include Settings/mcu_canbus.cfg]
#[include Settings/mcu_pico.cfg]
#[include Settings/steppers_24v.cfg]
[include Settings/steppers_48v.cfg]
[include Settings/save_variables.cfg] 
[include Settings/user_variables.cfg]

#  Macros
[include Macros/config_backup.cfg]
[include Macros/macros.cfg]
#[include Macros/setup_macros.cfg]
[include Macros/tests.cfg]
[include Macros/auto_mesh.cfg]
[include Macros/save_at_end.cfg]
#[include Macros/pause_park.cfg]
[include Macros/filament.cfg]
[include Macros/filament_runout.cfg]
[include Macros/bed_fans.cfg]
[include Macros/bed_mesh.cfg]
[include Macros/slicer.cfg]
[include Macros/webclient.cfg]
[include Macros/print_time.cfg]
[include Macros/homing.cfg]
[include Macros/power.cfg]
#[include Macros/probe_mag.cfg] #TAP disabled for TAP use.
[include Macros/probe_qgl.cfg]
#[include Macros/probe_z_calib.cfg] #TAP disabled as incompatible with TAP
[include Macros/park.cfg]
[include Macros/leds.cfg]

# Mods
#[include Klicky/klicky-probe.cfg]
#[include Macros/nozzle_scrub.cfg] #using NOZZLECLEAN in /filament.cfg instead.

[idle_timeout]
timeout: 600
gcode:
    M84
    TURN_OFF_HEATERS
    UPDATE_DELAYED_GCODE ID=delayed_printer_off DURATION=240 #check if idle every 240 secs and shut down if so.

#  macro that run at klipper start
[delayed_gcode _INIT]
initial_duration: 1
gcode:
  _USER_VARIABLE
  #_CHECK_CONSITENT
  #_EXECUTE_AT_INIT
  RUN_SHELL_COMMAND CMD=display_on
  _PRINT_AR T="Klipper INIT done"


#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
##	SSR Pin - BED_OUT
pwm_cycle_time: 0.0267 #added to reduce LED flicker
heater_pin: PA1 
sensor_type: Generic 3950
sensor_pin: PF3 #PF4 #PF3
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.8
min_temp: 0
max_temp: 115
control: pid #100c
pid_Kp=47.098
pid_Ki=3.738 
pid_Kd=148.357


#####################################################################
# 	Fan Control
#####################################################################

#[heater_fan controller_fan]
##	Controller fan - CNC_FAN2
#pin: PD12
#kick_start_time: 0.5
#heater: heater_bed
#heater_temp: 45.0
#fan_speed: 1

[fan_generic exhaust_fan]
#	Exhaust fan - CNC_FAN3
pin: PD14
max_power: 1.0
kick_start_time: 0.5
off_below: 0.10

[controller_fan mcu_fan]
##	Controller fan - CNC_FAN2
pin: PD12
shutdown_speed: 0.0
kick_start_time: 0.2
heater: heater_bed
fan_speed: 0.8
idle_timeout: 5
idle_speed: 0.4
stepper: stepper_x, stepper_y

[temperature_fan rpi_fan]
#	Exhaust fan - CNC_FAN3
pin: PD13
max_power: 0.5
shutdown_speed: 0.0
kick_start_time: 0.2
max_temp: 75
min_temp: 0
control: watermark
target_temp: 52
max_speed: 0.8
min_speed: 0
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp


#######################################
#### Enclosure Temp Sensor Section ####
#######################################
[thermistor chamber_temp]
temperature1: 25
resistance1: 10000
beta: 3950

[thermistor NTC10k]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

#[temperature_sensor pico_10k]
#sensor_type: NTC10k
#sensor_pin: pico:gpio28
#pullup_resistor: 1000

#[temperature_sensor enclosure]
#sensor_type: chamber_temp
#sensor_pin: PF5 #P0.23
#min_temp: 0
#max_temp: 100
#gcode_id: C

[temperature_sensor mcu]
sensor_type: temperature_mcu
sensor_mcu: mcu

#[temperature_sensor bme680]
#sensor_type: BME280
#i2c_address: 119
#i2c_bus: i2c0b #i2c1a
#i2c_mcu: pico #rpi #mcu

#[temperature_sensor host]
#sensor_type: temperature_host
#sensor_path: /sys/class/thermal/thermal_zone0/temp

#####################################################################
# 	LED Control
#####################################################################

[output_pin main_power]
pin: PE11
value: 1
shutdown_value: 1 ## Changed from 0 to 1 to avoid auto shutdown on error.
#pwm: false

#[output_pin psupower]
#pin: rpi:gpio21
#value: 1
#shutdown_value: 0


#[output_pin caselight]
# Chamber Lighting - HE1 Connector (Optional)
#pin: PA3
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01


[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=daylight VALUE=0.0
    #SET_LED LED=lights RED=0 GREEN=0 BLUE=0

[gcode_macro LIGHTS_50]
gcode:
    SET_PIN PIN=daylight VALUE=0.5
    #SET_LED LED=lights RED=1 GREEN=0.7 BLUE=0.2

[gcode_macro LIGHTS_MAX]
gcode:
    SET_PIN PIN=daylight VALUE=1.0
    #SET_LED LED=lights RED=1 GREEN=1 BLUE=1

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

#[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin 
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
#home_xy_position:205,303
#speed:100
#z_hop:10



########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

