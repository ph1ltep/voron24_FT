[mcu can]
canbus_uuid: 34f4eada9729 #8d503e0aaca5

## BOARD PINS
[board_pins SB2040_v1] 
mcu: can
aliases:
aliases_step:
    EXT_EN=gpio7,EXT_STEP=gpio9,EXT_DIR=gpio10,EXT_UART=gpio8
aliases_limitsw: # these are preferred for endstops (including klicky)
    LIMIT_1=gpio28,LIMIT_Z=gpio28,LIMIT_X=gpio29
aliases_bltouch: # these are the dupont connectors for bltouch
    PROBE_1=gpio28,PROBE_2=gpio28
aliases_fans:
    HEF=gpio14,PCF=gpio13
aliases_thermistors:
    TH0=gpio27,PT100_CS=gpio1,PT100_SCLK=gpio0,PT100_MISO=gpio2,PT100_MOSI=gpio3
aliases_heaters:
    HE0=gpio6
aliases_rgb:
    RGBLED=gpio12
aliases_adxl:
    ADXL_CS=gpio1,ADXL_SCLK=gpio0,ADXL_MISO=gpio2,ADXL_MOSI=gpio3
aliases_i2c:
    AUX0=PB3,AUX1=PB4