# Mellow Fly SHT36 Pro v1.0 - Pin aliases definition only
# This file defines only the pin aliases for the toolhead MCU
# It is meant to be included in the main config or overrides
# Based on Mellow Fly SHT36 Pro v1.0 hardware (RP2040 + TMC5160 SPI + ADXL345 SPI)

[board_pins toolhead_manufacturer]
mcu: toolhead
aliases:
    MCU_EMOT_STEP=gpio23, MCU_EMOT_DIR=gpio24, MCU_EMOT_EN=gpio25, MCU_EMOT_UART=gpio20, MCU_EMOT_DIAG=gpio22, # TMC5160 CS reused as UART alias for compatibility, but use cs_pin in tmc5160
    MCU_LIMIT_Z=gpio3, 
    MCU_LIMIT_X=gpio2,
    MCU_PROBE_1=gpio3,
    MCU_PROBE_2=gpio7,
    MCU_TH0=gpio26, #hot-end
    MCU_TH1=gpio27, 
    
    MCU_HE0=gpio8,
    
    MCU_PCF=gpio15, MCU_HEF=gpio14,
    MCU_RGBLED=gpio6,
    

    #MCU_EXT_CS=GPIO1 ,
    MCU_ADXL_CS=gpio9, 
    MCU_MAX31865_CS=gpio1,      
    
    MCU_SPI1_SCK=gpio10      , MCU_SPI1_MOSI=gpio11      , MCU_SPI1_MISO=gpio12      , 

[duplicate_pin_override]
pins: 
    gpio10, gpio11, gpio12