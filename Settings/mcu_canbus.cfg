# This file contains common pin mappings for the BIGTREETECH EBBCan
# Canbus board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB0/PB1)".
# The "EBB Can" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.
[mcu]
canbus_uuid: 0ad1ade02795

#[mcu can]
#canbus_uuid: 34f4eada9729 #8d503e0aaca5

##################################################################### 
# 	Accelerometer
#####################################################################

[adxl345]
cs_pin: can:ADXL_CS
spi_software_sclk_pin: can:SPI1_SCLK
spi_software_mosi_pin: can:SPI1_MOSI
spi_software_miso_pin: can:SPI1_MISO
axes_map: x,y,z

##################################################################### 
# 	Extruder
#####################################################################

[extruder]
microsteps: 32
gear_ratio: 50:8 #Moon 8T #50:10 CW2, 50:17 #CW1				#BMG Gear Ratio
rotation_distance: 21.641000 #22.0826532 #22.39620 CW2
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: can:HE0
pwm_cycle_time: 0.0267 #added to reduce LED flicker
min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 170 #170
control: pid #PID run at 215c
pid_Kp=21.081
pid_Ki=1.089
pid_Kd=101.981


pressure_advance: 0 #0.12145
pressure_advance_smooth_time: 0.040

max_extrude_only_distance: 101



#####################################################################
# 	Temp Control
#####################################################################

[temperature_sensor TH_MCU]
sensor_type: temperature_mcu
sensor_mcu: can
min_temp: 0
max_temp: 490

#[temperature_sensor Chamber_SB]
#sensor_type: ATC Semitec 104GT-2
#sensor_pin: can:gpio26
#min_temp: -50
#max_temp: 350

#[temperature_sensor Pico]
#sensor_type: temperature_mcu
#sensor_mcu: pico

#####################################################################
# 	Fan Control
#####################################################################

[fan]
pin: can:PCF
kick_start_time: 0.5
max_power: 1.0
off_below: 0.4

[heater_fan hotend_fan]
pin: can:HEF
heater: extruder
heater_temp: 50.0
max_power: 1.0
kick_start_time: 0.5

#####################################################################
# 	LED Control
#####################################################################

[neopixel toolhead]
pin: can:RGBLED
chain_count: 3
color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 1.0

[neopixel lights]
pin: PB0
chain_count: 12
color_order: BRG
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 0 # 1.0
initial_GREEN: 0 # 0.7
initial_BLUE: 0 # 0.2
#initial_WHITE: 0.2

[output_pin daylight]
pin: PB11
pwm: True
cycle_time: 0.001

#####################################################################
# 	Probe
#####################################################################

[probe]
##	Klicky
pin: ^can:LIMIT_Z #^PG11
x_offset: 0
y_offset: 0 #TAP
#z_offset: 0 #-0.97 #TAP 5.0
speed: 20 #5.0
lift_speed: 20 #30.0
samples: 4
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.007
samples_tolerance_retries: 20
activate_gcode:
    {% set PROBE_TEMP = 170 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

