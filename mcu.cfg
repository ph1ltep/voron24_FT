#--------------------------------------#
#### BTT Octopus MCU definition ########
#--------------------------------------#

[mcu]
##--------------------------------------------------------------------
# This board work by using a serial connection by default. If you
# want to use CAN, invert the commented lines and use canbus_uuid.
#serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_470039000550534E4E313120-if00
canbus_uuid: 0ad1ade02795
##--------------------------------------------------------------------

[include config/mcu_definitions/main/BTT_Octopus.cfg] # Do not remove this line
[board_pins octopus_mcu]
mcu: mcu
aliases:
    #X_STEP=MCU_MOTOR0_STEP   , X_DIR=MCU_MOTOR0_DIR   , X_ENABLE=MCU_MOTOR0_ENABLE   , X_TMCUART=MCU_MOTOR0_UART   ,
    #Y_STEP=MCU_MOTOR1_STEP   , Y_DIR=MCU_MOTOR1_DIR   , Y_ENABLE=MCU_MOTOR1_ENABLE   , Y_TMCUART=MCU_MOTOR1_UART   ,

    Z_STEP=MCU_MOTOR2_1_STEP , Z_DIR=MCU_MOTOR2_1_DIR , Z_ENABLE=MCU_MOTOR2_1_ENABLE , Z_TMCUART=MCU_MOTOR2_1_UART ,
    Z1_STEP=MCU_MOTOR3_STEP  , Z1_DIR=MCU_MOTOR3_DIR  , Z1_ENABLE=MCU_MOTOR3_ENABLE  , Z1_TMCUART=MCU_MOTOR3_UART  ,
    Z2_STEP=MCU_MOTOR4_STEP  , Z2_DIR=MCU_MOTOR4_DIR  , Z2_ENABLE=MCU_MOTOR4_ENABLE  , Z2_TMCUART=MCU_MOTOR4_UART  ,
    Z3_STEP=MCU_MOTOR5_STEP  , Z3_DIR=MCU_MOTOR5_DIR  , Z3_ENABLE=MCU_MOTOR5_ENABLE  , Z3_TMCUART=MCU_MOTOR5_UART  ,

    #E_STEP=MCU_MOTOR6_STEP   , E_DIR=MCU_MOTOR6_DIR   , E_ENABLE=MCU_MOTOR6_ENABLE   , E_TMCUART=MCU_MOTOR6_UART   ,

    DRIVER_SPI_MOSI=EXP2_6 , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_MISO=EXP2_1 , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_SCK=EXP2_2  , # Used in case of SPI drivers such as TMC2240 or TMC5160

    #X_STOP=MCU_STOP0 , 
    Y_STOP=MCU_STOP1 , 
    #Z_STOP=MCU_STOP2 ,
    #PROBE_INPUT=MCU_STOP7  ,
    #RUNOUT_SENSOR=MCU_STOP3 ,

    #E_HEATER=MCU_HE0   , E_TEMPERATURE=MCU_T0   , #handled in toolhead.
    BED_HEATER=MCU_BED0 , BED_TEMPERATURE=MCU_TB ,

    #PART_FAN=MCU_FAN0 , E_FAN=MCU_FAN1 ,          #handled in toolhead.
    CONTROLLER_FAN=MCU_FAN3        ,
    EXHAUST_FAN=MCU_FAN4           ,
    #FILTER_FAN=MCU_FAN4            ,
    BED_FAN=MCU_FAN5,
    HOST_CONTROLLER_FAN=MCU_FAN2   ,

    #CHAMBER_TEMPERATURE=MCU_T1 , ELECTRICAL_CABINET_TEMPERATURE=MCU_T2 ,

    LIGHT_OUTPUT=MCU_HE3         ,
    LIGHT_NEOPIXEL=MCU_STOP5     ,
    STATUS_NEOPIXEL=MCU_NEOPIXEL ,

    #SERVO_PIN=MCU_SERVOS ,

#--------------------------------------------#
#### Fysetc PITB V2 ########
#--------------------------------------------#
[mcu pitb]
canbus_uuid: 4785971e7946

[include custom/mcu_definitions/main/Fysetc_PITB_v2.cfg]
[board_pins pitb_mcu]
mcu: pitb
aliases:
    X_STEP=MOT2_STEP   , X_DIR=MOT2_DIR   , X_ENABLE=MOT2_EN   , X_TMCUART=MOT2_CS , X_DIAG=MOT2_DIAG  ,
    Y_STEP=MOT1_STEP   , Y_DIR=MOT1_DIR   , Y_ENABLE=MOT1_EN   , Y_TMCUART=MOT1_CS , Y_DIAG=MOT1_DIAG  ,

    X_STOP=ENDSTOP_X ,
    Y_STOP=ENDSTOP_Y ,

    TEMP0=THERM0, TEMP1=THERM1, TEMP2=THERM2, 

    DRIVER_SPI_MOSI=MOSI , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_MISO=MISO , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_SCK=SCLK , # Used in case of SPI drivers such as TMC2240 or TMC5160

[stepper_x]
step_pin: pitb:X_STEP
dir_pin: pitb:X_DIR
enable_pin: !pitb:X_ENABLE

[tmc5160 stepper_x]
cs_pin: pitb:X_TMCUART
diag0_pin: ^!pitb:X_DIAG

[stepper_y]
step_pin: pitb:Y_STEP
dir_pin: pitb:Y_DIR
enable_pin: !pitb:Y_ENABLE
endstop_pin: ^pitb:Y_STOP

[tmc5160 stepper_y]
cs_pin: pitb:Y_TMCUART
diag0_pin: ^!pitb:Y_STOP

[temperature_sensor mcu_pitb]
sensor_type: temperature_mcu
sensor_mcu: pitb

[temperature_sensor Motor_B_Driver]
sensor_type: Generic 3950
sensor_pin: pitb:TEMP1
pullup_resistor: 4700

# [temperature_sensor Motor_A_Driver]
# sensor_type: Generic 3950
# sensor_pin: pitb:TEMP0
# pullup_resistor: 4700

#--------------------------------------------#
#### Cartographer 3D V3               ########
#--------------------------------------------#
[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_614e_320013000E43304253383020-if00
restart_method: command # Not needed for probes using CAN.

[include custom/mcu_definitions/scanner/Cartographer3D_V3.cfg]
[board_pins cartographer_mcu]
mcu: cartographer
aliases:
    ADXL_CS=MCU_ADXL,
    

#--------------------------------------------#
#### LDO Nitehwak 36 Rev C            ########
#--------------------------------------------#

[mcu toolhead]
##--------------------------------------------------------------------
#serial: /dev/serial/by-id/usb-Klipper_rp2040_3136313132022D93-if00 # White #### <---  change-me-to-the-correct-serial  hint: ls /dev/serial/by-id/*   #
serial: /dev/serial/by-id/usb-Klipper_rp2040_3136313132029FEC-if00 # Yellow
##--------------------------------------------------------------------

# If you want to override the wiring of the LDO Nighthawk, keep in mind that this
# board is defined using the "toolhead" name. So you should use "pin: toolhead:PIN_NAME"
# in your own overrides.cfg files.

[include custom/mcu_definitions/toolhead/LDO_Nitehawk-36_revC.cfg] # Do not remove this line
[board_pins nitehawk_mcu]
mcu: toolhead
aliases:
    E_STEP=MCU_EMOT_STEP , E_DIR=MCU_EMOT_DIR , E_ENABLE=MCU_EMOT_EN , E_TMCUART=MCU_EMOT_UART ,

    #X_STOP=MCU_ENDSTOP_X ,
    PROBE_INPUT=MCU_PROBE_1 ,

    E_HEATER=MCU_HEAT , E_TEMPERATURE=MCU_TEMP , 
    NH_MCU_TEMP=MCU_NH_TEMP ,

    E_FAN=MCU_FAN0 , PART_FAN=MCU_FAN1 ,
    E_FAN_TACHO=MCU_PWM0 ,

    STATUS_NEOPIXEL=MCU_RGB , STATUS_BOARD=MCU_ACTIVITY_LED , 

    ADXL_CS=MCU_ADXL_CS , ADXL_SCLK=MCU_ADXL_SCK , ADXL_MOSI=MCU_ADXL_MOSI , ADXL_MISO=MCU_ADXL_MISO ,

    TX_PIN=MCU_EMOT_TX , 


#------------------------------------------#
#  LDO Nighthawk-36 rev C+ pins remapping  #
#------------------------------------------#

# These pins overrides are automatically added when you select the LDO
# toolhead MCU during the installation process. They should provide a
# good base to work with. Feel free to adapt to your board if needed!

[extruder]
step_pin: toolhead:E_STEP
dir_pin: toolhead:E_DIR
enable_pin: !toolhead:E_ENABLE
heater_pin: toolhead:E_HEATER
sensor_pin: toolhead:E_TEMPERATURE
pullup_resistor: 2200

[tmc2209 extruder]
uart_pin: toolhead:E_TMCUART
tx_pin: toolhead:TX_PIN
sense_resistor: 0.100
interpolate: false
run_current: 0.6        #recommend setting it below 0.7A.

[probe]
#pin: ^toolhead:PROBE_INPUT

[fan]
pin: toolhead:PART_FAN

[heater_fan hotend_fan]
pin: toolhead:E_FAN
tachometer_pin: toolhead:E_FAN_TACHO
tachometer_ppr: 2

## Uncomment the following line if not using sensorless homing
## and having the X endstop plugged to the toolhead MCU
# [stepper_x]
# endstop_pin: ^toolhead:X_STOP

[temperature_sensor mcu_toolhead]
sensor_type: temperature_mcu
sensor_mcu: toolhead

[neopixel status_leds]
pin: toolhead:STATUS_NEOPIXEL

[output_pin act_led]
pin: !toolhead:STATUS_BOARD

## Uncomment the following line if using filament sensor
#[filament_switch_sensor filament_sensor]
#switch_pin: toolhead:RUNOUT_SENSOR
#pause_on_runout: True